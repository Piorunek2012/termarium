[package]
name = "termarium"
version = "0.1.0"
edition = "2021"
description = "A living aquarium in your terminal: Linux processes as fish"
license = "MIT"
repository = "https://github.com/Piorunek2012/termarium"
readme = "README.md"
keywords = ["tui", "linux", "system-monitor", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.28"
sysinfo = "0.32"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
